<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>Scoreboard</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="main">
        <div class="home">
          <p class="home__title">Home</p>
          <p class="home__display">20</p>
          <div class="home__btns">
            <button class="btn" data-points="1">+1</button>
            <button class="btn" data-points="2">+2</button>
            <button class="btn" data-points="3">+3</button>
          </div>
        </div>
        <div class="guest">
          <p class="guest__title">Guest</p>
          <p class="guest__display">50</p>
          <div class="guest__btns">
            <button class="btn" data-points="1">+1</button>
            <button class="btn" data-points="2">+2</button>
            <button class="btn" data-points="2">+3</button>
          </div>
        </div>
      </div>
      <button class="btn new-game">New Game</button>
    </div>
  </body>
</html>
