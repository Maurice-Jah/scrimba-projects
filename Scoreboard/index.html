<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Scoreboard</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="home">
        <p class="home__score">20</p>
        <p class="home__display"></p>
        <div class="home__btns btn">
          <button>+1</button>
          <button>+2</button>
          <button>+3</button>
        </div>
      </div>
      <div class="guest">
        <p class="guest__score">50</p>
        <p class="guest__display"></p>
        <div class="guest__btns btn">
          <button>+1</button>
          <button>+2</button>
          <button>+3</button>
        </div>
      </div>
    </div>
  </body>
</html>
