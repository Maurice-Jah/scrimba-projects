<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>
  </head>
  <body>
    <header>
      <h1 class="title">Metric/Imperial Unit Conversion</h1>
      <div class="result">0</div>
      <button class="btn btn-convert">Convert</button>
    </header>
    <main>
      <section class="unit">
        <h3 class="unit__title">Length (Meter/Feet)</h3>
        <div class="unit__conversion">
          <p>0 meters = 0 feet</p>
          <p>0 feet = 0 meters</p>
        </div>
      </section>
      <section class="unit">
        <h3 class="unit__title">Volume (Liters/Gallons)</h3>
        <div class="unit__conversion">
          <p>0 liters = 0 gallons</p>
          <p>0 gallons = 0 liters</p>
        </div>
      </section>
      <section class="unit">
        <h3 class="unit__title">Mass (Kilograms/Pounds)</h3>
        <div class="unit__conversion">
          <p>0 kilos = 0 pounds</p>
          <p>0 pounds = 0 kilos</p>
        </div>
      </section>
    </main>
  </body>
</html>
